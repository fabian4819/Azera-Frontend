<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282A8F"/>
      <stop offset="100%" stop-color="#15157D"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E8E5FD" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <!-- ==================== GROUND SHADOWS ==================== -->
  <ellipse cx="400" cy="505" rx="330" ry="22" fill="#E8E6FC" opacity="0.8"/>
  <ellipse cx="400" cy="505" rx="220" ry="14" fill="#D5D1FA" opacity="0.85"/>

  <!-- ==================== SPARKLES & AMBIENT FLOURISHES ==================== -->
  <!-- Top Left Lime Sparkle Star -->
  <path d="M 80 140 Q 95 140 95 125 Q 95 140 110 140 Q 95 140 95 155 Q 95 140 80 140 Z" fill="#CCFF00" stroke="#15157D" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Top Right Lime Sparkle Star -->
  <path d="M 715 105 Q 730 105 730 90 Q 730 105 745 105 Q 730 105 730 120 Q 730 105 715 105 Z" fill="#CCFF00" stroke="#15157D" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Mid Right Lime Sparkle Star -->
  <path d="M 730 320 Q 741 320 741 309 Q 741 320 752 320 Q 741 320 741 331 Q 741 320 730 320 Z" fill="#CCFF00" stroke="#15157D" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Bottom Left Mini Star -->
  <path d="M 120 425 Q 130 425 130 415 Q 130 425 140 425 Q 130 425 130 435 Q 130 425 120 425 Z" fill="#CCFF00" stroke="#15157D" stroke-width="3" stroke-linejoin="round"/>

  <!-- Floating playful dots & circles -->
  <circle cx="170" cy="75" r="7" fill="#6728E4"/>
  <circle cx="610" cy="50" r="5" fill="#CCFF00" stroke="#15157D" stroke-width="3"/>
  <circle cx="68" cy="270" r="4.5" fill="#15157D"/>
  <circle cx="725" cy="210" r="6" fill="#814BFE"/>
  <circle cx="705" cy="450" r="6" fill="#CCFF00"/>

  <!-- ==================== LEFT FLOATING CARD (Creator Profile Candidate) ==================== -->
  <g transform="rotate(-9 180 230)">
    <!-- Base Card -->
    <rect x="80" y="115" width="160" height="205" rx="18" fill="#FFFFFF" stroke="#15157D" stroke-width="4.5"/>
    
    <!-- Profile Avatar Container (Empty dashed state) -->
    <rect x="98" y="133" width="124" height="92" rx="12" fill="#F4F3FF" stroke="#A3A0FB" stroke-width="2.5" stroke-dasharray="6 5"/>
    
    <!-- Stylized Avatar Silhouette (Dark Navy & Purple - matching 1-matching.webp) -->
    <!-- Hair -->
    <path d="M 160 148 C 145 148 139 157 139 168 C 139 175 143 182 147 185 C 138 188 132 197 132 208 L 188 208 C 188 197 182 188 173 185 C 177 182 181 175 181 168 C 181 157 175 148 160 148 Z" fill="#15157D"/>
    <!-- Face cutout in white -->
    <circle cx="160" cy="167" r="11" fill="#FFFFFF"/>
    <!-- Purple Shirt -->
    <path d="M 143 208 C 143 199 150 193 160 193 C 170 193 177 199 177 208 Z" fill="#814BFE"/>

    <!-- Placeholder skeleton bars -->
    <rect x="98" y="242" width="80" height="11" rx="5.5" fill="#15157D"/>
    <rect x="98" y="261" width="120" height="8" rx="4" fill="#E2E6FF"/>
    <rect x="98" y="277" width="65" height="8" rx="4" fill="#E2E6FF"/>

    <!-- Top Badge: Purple Heart Badge (Exact match to 1-matching.webp) -->
    <g transform="translate(202, 100)">
      <circle cx="21" cy="21" r="22" fill="#814BFE" stroke="#15157D" stroke-width="4"/>
      <!-- Heart -->
      <path d="M 21 28 C 16 23 11 19 11 14.8 C 11 11.2 13.8 8.5 17.2 8.5 C 19.2 8.5 21 9.6 21 11.1 C 21 9.6 22.8 8.5 24.8 8.5 C 28.2 8.5 31 11.2 31 14.8 C 31 19 26 23 21 28 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Connecting Curved Arrow from left card towards laptop -->
  <path d="M 230 270 C 265 285 270 300 280 320" fill="none" stroke="#15157D" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="274,310 285,326 288,312" fill="#CCFF00" stroke="#15157D" stroke-width="3" stroke-linejoin="round"/>

  <!-- ==================== TOP RIGHT FLOATING CARD (Campaign Analytics) ==================== -->
  <g transform="rotate(8 585 155)">
    <!-- Main Card Body -->
    <rect x="500" y="65" width="170" height="135" rx="18" fill="#FFFFFF" stroke="#15157D" stroke-width="4.5"/>
    
    <!-- Neon Lime Header Bar -->
    <path d="M 504 83 C 504 73 512 69 522 69 L 648 69 C 658 69 666 73 666 83 L 666 88 L 504 88 Z" fill="#CCFF00" stroke="#15157D" stroke-width="4.5"/>
    
    <!-- Left Icon: Circle with Mini Chart -->
    <circle cx="538" cy="120" r="17" fill="#EDE9FE" stroke="#15157D" stroke-width="3"/>
    <path d="M 531 127 L 531 122 M 538 127 L 538 116 M 545 127 L 545 119" stroke="#814BFE" stroke-width="3" stroke-linecap="round"/>

    <!-- Placeholder bars -->
    <rect x="566" y="110" width="80" height="10" rx="5" fill="#15157D"/>
    <rect x="566" y="127" width="55" height="8" rx="4" fill="#814BFE" opacity="0.6"/>

    <!-- Category Pill Badges -->
    <rect x="520" y="152" width="60" height="22" rx="11" fill="#EDE9FE" stroke="#15157D" stroke-width="2.5"/>
    <rect x="588" y="152" width="65" height="22" rx="11" fill="#CCFF00" stroke="#15157D" stroke-width="2.5"/>

    <!-- Corner Star Badge (Lime circle + Navy Star - matching 1-matching.webp) -->
    <g transform="translate(638, 45)">
      <circle cx="20" cy="20" r="22" fill="#CCFF00" stroke="#15157D" stroke-width="4"/>
      <polygon points="20,10 23.5,17 31,18 25.5,23.5 27,31 20,27 13,31 14.5,23.5 9,18 16.5,17" fill="#15157D"/>
    </g>
  </g>

  <!-- Connecting Curved Arrow from top right to laptop -->
  <path d="M 510 210 C 475 228 460 238 440 245" fill="none" stroke="#15157D" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="446,236 432,248 446,254" fill="#CCFF00" stroke="#15157D" stroke-width="3" stroke-linejoin="round"/>

  <!-- ==================== CENTRAL HUB: LAPTOP / DISPLAY (A la 1-matching.webp) ==================== -->
  <g>
    <!-- Screen Frame Outer Border -->
    <rect x="250" y="160" width="315" height="235" rx="18" fill="#15157D"/>
    <!-- Screen Bezel -->
    <rect x="256" y="166" width="303" height="223" rx="14" fill="#181A64"/>
    
    <!-- Neon Lime Screen Top Bezel Bar -->
    <path d="M 268 184 C 268 174 276 170 286 170 L 529 170 C 539 170 547 174 547 184 L 547 202 L 268 202 Z" fill="#CCFF00" stroke="#15157D" stroke-width="3.5"/>
    
    <!-- 3 Header Dots -->
    <circle cx="286" cy="186" r="4.5" fill="#15157D"/>
    <circle cx="300" cy="186" r="4.5" fill="#15157D"/>
    <circle cx="314" cy="186" r="4.5" fill="#15157D"/>

    <!-- Screen Canvas (Crisp White Canvas) -->
    <rect x="268" y="202" width="279" height="175" fill="#FFFFFF" stroke="#15157D" stroke-width="3.5"/>

    <!-- ==================== EMPTY STATE CONTENT INSIDE SCREEN ==================== -->
    <!-- Large Dashed Empty Portfolio Box -->
    <rect x="284" y="216" width="247" height="147" rx="14" fill="#F8F7FF" stroke="#814BFE" stroke-width="2.5" stroke-dasharray="8 6"/>

    <!-- Cute Empty Portfolio Showcase Centerpiece -->
    <g transform="translate(365, 230)">
      <!-- Folder/Binder Graphic -->
      <!-- Back Tab -->
      <path d="M 12 18 L 38 18 L 46 26 L 82 26 C 86 26 90 30 90 34 L 90 74 C 90 78 86 82 82 82 L 12 82 C 8 82 4 78 4 74 L 4 26 C 4 22 8 18 12 18 Z"
            fill="#EDE9FE" stroke="#814BFE" stroke-width="3" stroke-linejoin="round"/>
      
      <!-- Blank Portfolio Card Peeking Out -->
      <rect x="22" y="8" width="56" height="42" rx="7" fill="#FFFFFF" stroke="#15157D" stroke-width="3"/>
      <!-- Dashed photo placeholder inside card -->
      <rect x="28" y="14" width="44" height="24" rx="4" fill="#F4F3FF" stroke="#A3A0FB" stroke-width="2" stroke-dasharray="4 3"/>
      <!-- Play/Sparkle symbol inside card -->
      <polygon points="47,21 55,26 47,31" fill="#814BFE"/>

      <!-- Front Folder Flap in Brand Purple -->
      <path d="M 4 44 L 32 44 L 42 53 L 90 53 L 90 74 C 90 78 86 82 82 82 L 12 82 C 8 82 4 78 4 74 Z"
            fill="#6728E4" stroke="#15157D" stroke-width="3" stroke-linejoin="round"/>
      
      <!-- Plus Action Badge in Electric Lime -->
      <circle cx="76" cy="65" r="14" fill="#CCFF00" stroke="#15157D" stroke-width="3"/>
      <path d="M 76 58 L 76 72 M 69 65 L 83 65" stroke="#15157D" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Placeholder skeleton text bars below folder -->
    <rect x="345" y="326" width="125" height="10" rx="5" fill="#DDD6FE"/>
    <rect x="375" y="342" width="65" height="7" rx="3.5" fill="#E8E5FD"/>

    <!-- ==================== LAPTOP BASE & KEYBOARD ==================== -->
    <!-- Base Bevel 3D Perspective Body (matching 1-matching.webp) -->
    <path d="M 215 394 L 600 394 L 575 440 L 240 440 Z" fill="url(#laptopGrad)" stroke="#15157D" stroke-width="4.5" stroke-linejoin="round"/>
    
    <!-- Base Bottom Edge (Dark Navy lip) -->
    <path d="M 240 440 L 575 440 L 565 450 L 250 450 Z" fill="#121350" stroke="#15157D" stroke-width="4"/>
    
    <!-- Trackpad in Deep Blue with Lime Outline Accent -->
    <rect x="365" y="405" width="85" height="24" rx="6" fill="#1A1C6E" stroke="#2E3192" stroke-width="2"/>
    <line x1="385" y1="409" x2="430" y2="409" stroke="#CCFF00" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ==================== BOTTOM RIGHT FLOATING METRICS CARD ==================== -->
  <g transform="rotate(-6 620 420)">
    <!-- White Card Body -->
    <rect x="535" y="360" width="160" height="110" rx="16" fill="#FFFFFF" stroke="#15157D" stroke-width="4.5"/>
    
    <!-- Card Header -->
    <rect x="552" y="376" width="70" height="9" rx="4.5" fill="#15157D"/>
    
    <!-- Mini Bar Chart (Showing waiting / empty state) -->
    <rect x="555" y="420" width="15" height="30" rx="4" fill="#814BFE" stroke="#15157D" stroke-width="2.5"/>
    <rect x="578" y="402" width="15" height="48" rx="4" fill="#CCFF00" stroke="#15157D" stroke-width="2.5"/>
    <rect x="601" y="428" width="15" height="22" rx="4" fill="#EDE9FE" stroke="#15157D" stroke-width="2.5"/>
    <!-- Dashed Empty Target Bar -->
    <rect x="624" y="392" width="15" height="58" rx="4" fill="none" stroke="#A3A0FB" stroke-width="2.5" stroke-dasharray="4 3"/>
    
    <!-- Mini Check / Trend Badge in Lime -->
    <circle cx="660" cy="380" r="12" fill="#CCFF00" stroke="#15157D" stroke-width="2.5"/>
    <path d="M 655 380 L 659 384 L 666 376" stroke="#15157D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ==================== LARGE MAGNIFYING GLASS (HERO INSPECTOR) ==================== -->
  <!-- Positioned on the right, inspecting with handle pointing down-right -->
  <g transform="translate(30, 10)">
    <!-- Neon Lime Radiant Rays popping from lens -->
    <line x1="560" y1="140" x2="560" y2="115" stroke="#CCFF00" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="520" y1="160" x2="500" y2="145" stroke="#CCFF00" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="600" y1="160" x2="620" y2="145" stroke="#CCFF00" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="495" y1="200" x2="475" y2="200" stroke="#CCFF00" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Magnifying Glass Tilted (~ -38 deg so handle points down-right) -->
    <g transform="rotate(-38 560 215)">
      <!-- Handle Shadow / Body (pointing down in group, which rotates to down-right) -->
      <rect x="548" y="310" width="26" height="120" rx="13" fill="#15157D"/>
      <rect x="544" y="305" width="26" height="120" rx="13" fill="#2E3192" stroke="#15157D" stroke-width="5"/>
      <!-- Neon Lime Grip Stripe on Handle -->
      <rect x="544" y="360" width="26" height="20" fill="#CCFF00" stroke="#15157D" stroke-width="3.5"/>

      <!-- Large Outer Ring in Rich Brand Purple -->
      <circle cx="557" cy="210" r="84" fill="#6728E4" stroke="#15157D" stroke-width="6"/>
      <!-- Inner Ring in Periwinkle -->
      <circle cx="557" cy="210" r="68" fill="#814BFE" stroke="#15157D" stroke-width="3.5"/>
      <!-- Glass Lens -->
      <circle cx="557" cy="210" r="56" fill="url(#lensGrad)" stroke="#15157D" stroke-width="3"/>

      <!-- Gloss Glare / Curved highlight -->
      <path d="M 526 172 C 545 158 576 158 594 174" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
      <circle cx="602" cy="188" r="4" fill="#FFFFFF" opacity="0.95"/>

      <!-- Inside Lens: Search / Empty Discovery Radar -->
      <g transform="translate(557, 210)">
        <circle cx="0" cy="0" r="30" fill="none" stroke="#814BFE" stroke-width="2.5" stroke-dasharray="6 5"/>
        <!-- Starburst Sparkle Center -->
        <path d="M -14 0 Q 0 -4 0 -14 Q 0 -4 14 0 Q 0 4 0 14 Q 0 4 -14 0 Z" fill="#CCFF00" stroke="#15157D" stroke-width="2.5"/>
      </g>
    </g>
  </g>
</svg>
